<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Países</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Combobox -->
    <div class = "selecao">
        <h1>🌍 Countries Explorer</h1>
        <p>Selecione um país para conhecer suas informações.</p>
            <select class="selectBuscar">
                <option value="">Selecione...</option>
            </select>
    </div>
    
    <!-- Informações dos países -->
     <div class = "Main">
        <img id="bandeira" alt="">
        <h2>Nome</h2>
        <div id="nome"></div>
        <h2>Informações:</h2>
        <div id="capital"></div>
        <div id="continente"></div>
        <p id="populacao"></p>
        <p id="area"></p>
        <div id="moedas"></div>
        <div id="idiomas"></div>
        <div id="iso"></div>
        <div id="telefone"></div>
        <div id="fusoHorario"></div>
        <div id="mapas"></div>
        <h2>Fronteiras:</h2>
        <div id="fronteiras"></div>
     </div>

    <script src="script.js"></script>
</body>
</html>
